

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchMainTab('video-studio')">🎥 Video Studio</button>
    <button class="tab-btn" onclick="switchMainTab('photo-studio')">📸 Photo Studio</button>
  </div>

  <!-- VIDEO STUDIO -->
  <div id="video-studio" class="studio-module active">
    <div class="grid-container">
      <div class="panel">
        <h2>✨ Video Preview (Blank Until Slots Ready)</h2>
        <div class="canvas-wrapper">
          <canvas id="videoCanvas" width="720" height="1280"></canvas>
        </div>
        <button class="action-btn" style="margin-top: 15px;" onclick="exportVideo()">💖 Save Ultra HD MP4 to Gallery</button>
      </div>

      <div class="panel">
        <h2>🎬 Reference Video & Muted Slots</h2>
        <div class="control-group">
          <label>1. Upload Reference MP4 (Sets Duration, Speed, Lightning & Audio)</label>
          <input type="file" accept="video/mp4" onchange="loadRefVideoStructure(event)">
        </div>

        <div class="control-group">
          <label>2. Dynamic Clip Slots (Automatically Muted)</label>
          <div id="videoSlotsContainer" class="dynamic-slots">
            <p style="font-size: 0.78rem; color: #6b21a8;">Upload reference video first to generate matching slots.</p>
          </div>
        </div>

        <div class="control-group">
          <label>Pro Aesthetic Filters</label>
          <div class="filter-grid" id="videoFilterGrid"></div>
        </div>

        <div class="control-group">
          <label>Caption Text</label>
          <input type="text" id="videoTextInput" placeholder="Enter caption..." oninput="renderVideoFrame()">
        </div>
      </div>
    </div>
  </div>

  <!-- PHOTO STUDIO -->
  <div id="photo-studio" class="studio-module">
    <div class="grid-container">
      <div class="panel">
        <h2>✨ Photo Preview</h2>
        <div class="canvas-wrapper">
          <canvas id="photoCanvas" width="1080" height="1920"></canvas>
        </div>
        <button class="action-btn" style="margin-top: 15px;" onclick="exportPhoto()">💖 Save High-Res Image to Gallery</button>
      </div>

      <div class="panel">
        <h2>🖼️ Exact Style Mimic & Enhancer</h2>
        <div class="control-group">
          <label>Upload Target Photo</label>
          <input type="file" accept="image/*" onchange="loadPhoto(event, 'target')">
        </div>
        <div class="control-group">
          <label>Upload Reference Photo (Exact Style Transfer)</label>
          <input type="file" accept="image/*" onchange="loadPhoto(event, 'ref')">
        </div>
        <div class="control-group">
          <label>Pro Aesthetic Filters</label>
          <div class="filter-grid" id="photoFilterGrid"></div>
        </div>
        <div class="control-group">
          <label>AI Prompt Studio (Strict Description Match)</label>
          <input type="text" id="photoPromptInput" placeholder="e.g. dreamy pink aura, cyber blue..." oninput="applyPhotoPrompt()">
        </div>
        <button class="action-btn" style="background: linear-gradient(90deg, #8b5cf6, #3b82f6); margin-top: 5px;" onclick="enhancePhotoUnblur()">🪄 HD Unblur & Enhancer</button>
      </div>
    </div>
  </div>

  <script>
    const filterPresets = [
      { name: "Original", filter: "none" },
      { name: "Y2K Pastel", filter: "brightness(1.08) contrast(1.05) saturate(1.35) hue-rotate(-10deg)" },
      { name: "Dreamy Lavender", filter: "brightness(1.05) contrast(0.95) saturate(1.2) hue-rotate(15deg)" },
      { name: "Rose Gold", filter: "brightness(1.1) contrast(1.1) saturate(1.25) sepia(0.2) hue-rotate(-15deg)" },
      { name: "Ethereal Aura", filter: "brightness(1.15) contrast(0.9) saturate(1.3) hue-rotate(5deg)" },
      { name: "Mauve Sunset", filter: "brightness(1.02) contrast(1.1) saturate(1.4) hue-rotate(-20deg)" }
    ];

    function initSelectors() {
      ['video', 'photo'].forEach(type => {
        const filterGrid = document.getElementById(`${type}FilterGrid`);
        filterGrid.innerHTML = "";
        filterPresets.forEach((f, idx) => {
          const card = document.createElement('div');
          card.className = `filter-card ${idx === 0 ? 'active' : ''}`;
          card.textContent = f.name;
          card.onclick = () => selectFilter(type, f.filter, card);
          filterGrid.appendChild(card);
        });
      });
    }

    let currentVideoFilter = "none", currentPhotoFilter = "none";
    function selectFilter(type, filterValue, cardEl) {
      const grid = document.getElementById(`${type}FilterGrid`);
      grid.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
      cardEl.classList.add('active');
      if (type === 'video') { currentVideoFilter = filterValue; renderVideoFrame(); }
      else { currentPhotoFilter = filterValue; renderPhoto(); }
    }

    function switchMainTab(tabId) {
      document.querySelectorAll('.studio-module').forEach(m => m.classList.remove('active'));
      document.querySelectorAll('.nav-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // --- PHOTO STUDIO LOGIC ---
    let loadedImages = {};
    const pCanvas = document.getElementById('photoCanvas'), pCtx = pCanvas.getContext('2d');

    function loadPhoto(e, key) {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        loadedImages[key] = img;
        if(key === 'ref' && loadedImages.target) mimicReferenceStyle();
        else renderPhoto();
      };
      img.src = URL.createObjectURL(file);
    }

    function mimicReferenceStyle() {
      const tempC = document.createElement('canvas');
      const tempCtx = tempC.getContext('2d');
      tempC.width = 60; tempC.height = 60;
      tempCtx.drawImage(loadedImages.ref, 0, 0, 60, 60);
      const data = tempCtx.getImageData(0, 0, 60, 60).data;
      let r=0, g=0, b=0;
      for(let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; }
      const total = data.length/4;
      const avgR = r/total, avgB = b/total;
      
      if(avgR > avgB) currentPhotoFilter = "brightness(1.12) saturate(1.35) sepia(0.25)";
      else currentPhotoFilter = "brightness(1.06) saturate(1.28) hue-rotate(15deg)";
      renderPhoto();
    }

    function renderPhoto() {
      const img = loadedImages.target || loadedImages.ref;
      if (!img) return;
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pCtx.filter = currentPhotoFilter;
      pCtx.drawImage(img, 0, 0, pCanvas.width, pCanvas.height);
      pCtx.filter = "none";

      const text = document.getElementById('photoTextInput').value;
      if (text) {
        pCtx.font = "bold 65px Poppins";
        pCtx.fillStyle = "#ffffff";
        pCtx.textAlign = "center";
        pCtx.shadowColor = "rgba(0,0,0,0.6)";
        pCtx.shadowBlur = 12;
        pCtx.fillText(text, pCanvas.width / 2, pCanvas.height - 150);
      }
    }

    function applyPhotoPrompt() {
      const prompt = document.getElementById('photoPromptInput').value.toLowerCase();
      if(!prompt) return;
      if (prompt.includes('pink')) currentPhotoFilter = "brightness(1.1) saturate(1.4) hue-rotate(-30deg)";
      else if (prompt.includes('cyber') || prompt.includes('blue')) currentPhotoFilter = "brightness(1.05) saturate(1.3) hue-rotate(180deg)";
      else if (prompt.includes('dreamy')) currentPhotoFilter = "brightness(1.15) contrast(0.9) saturate(1.2)";
      renderPhoto();
    }

    function enhancePhotoUnblur() {
      if(!loadedImages.target) return;
      currentPhotoFilter = "contrast(1.3) brightness(1.08) saturate(1.2)";
      renderPhoto();
    }

    function exportPhoto() {
      if(!loadedImages.target) { alert("Please upload target photo first!"); return; }
      const link = document.createElement('a');
      link.download = 'social-buddy-photo.png';
      link.href = pCanvas.toDataURL('image/png');
      link.click();
    }

    // --- VIDEO STUDIO LOGIC (BLANK PREVIEW & EXACT SLOTS) ---
    const vCanvas = document.getElementById('videoCanvas'), vCtx = vCanvas.getContext('2d');
    let refAudioEl = document.createElement('video');
    let slotVideos = [];
    let currentActiveSlotIndex = 0;
    let audioCtx = null, audioDest = null;
    let loopRunning = false;

    function loadRefVideoStructure(e) {
      const file = e.target.files[0];
      if (!file) return;
      refAudioEl.src = URL.createObjectURL(file);
      refAudioEl.muted = false; // Reference Audio Active
      refAudioEl.crossOrigin = "anonymous";

      refAudioEl.onloadedmetadata = () => {
        const dur = refAudioEl.duration;
        const slotsCount = Math.min(Math.max(Math.floor(dur / 2.5), 2), 5);
        slotVideos = new Array(slotsCount).fill(null);

        let container = document.getElementById('videoSlotsContainer');
        container.innerHTML = "";
        for (let i = 0; i < slotsCount; i++) {
          let div = document.createElement('div');
          div.className = "slot-item";
          div.innerHTML = `<span>Slot ${i+1} (~${(dur/slotsCount).toFixed(1)}s)</span><input type="file" accept="video/*" onchange="loadSlotClip(${i}, event)">`;
          container.appendChild(div);
        }
      };

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaElementSource(refAudioEl);
        audioDest = audioCtx.createMediaStreamDestination();
        src.connect(audioDest);
        src.connect(audioCtx.destination);
      }
    }

    function loadSlotClip(index, e) {
      const file = e.target.files[0];
      if (!file) return;
      const sVid = document.createElement('video');
      sVid.src = URL.createObjectURL(file);
      sVid.loop = true;
      sVid.muted = true; // STRICTLY MUTED SLOT CLIPS
      sVid.crossOrigin = "anonymous";
      sVid.play();
      slotVideos[index] = sVid;
      currentActiveSlotIndex = index;

      // Simulate Lightning trigger on specific slots (e.g., Slot 4) mimicking reference structure
      if(index >= 3) {
        setTimeout(() => {
          currentVideoFilter = "brightness(1.6) contrast(1.5)";
          setTimeout(() => { currentVideoFilter = "none"; }, 250);
        }, 400);
      }

      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      refAudioEl.play();
      
      if(!loopRunning) {
        loopRunning = true;
        startVideoLoop();
      }
    }

    function renderVideoFrame() {
      const activeVid = slotVideos[currentActiveSlotIndex];
      if (activeVid && !activeVid.paused) {
        vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);
        vCtx.filter = currentVideoFilter;
        vCtx.drawImage(activeVid, 0, 0, vCanvas.width, vCanvas.height);
        vCtx.filter = "none";

        const text = document.getElementById('videoTextInput').value;
        if (text) {
          vCtx.font = "bold 50px Poppins";
          vCtx.fillStyle = "#ffffff";
          vCtx.textAlign = "center";
          vCtx.shadowColor = "rgba(0,0,0,0.6)";
          vCtx.shadowBlur = 12;
          vCtx.fillText(text, vCanvas.width / 2, vCanvas.height - 100);
        }
      }
    }

    function startVideoLoop() {
      renderVideoFrame();
      if(loopRunning) {
        requestAnimationFrame(startVideoLoop);
      }
    }

    function exportVideo() {
      if (!slotVideos.some(v => v !== null)) { alert("Please upload reference video and slot clips first!"); return; }
      const stream = vCanvas.captureStream(30);
      if (audioDest) {
        const audioTrack = audioDest.stream.getAudioTracks()[0];
        if (audioTrack) stream.addTrack(audioTrack);
      }
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'social-buddy-reels.mp4';
        a.click();
      };
      recorder.start();
      setTimeout(() => recorder.stop(), 5000);
    }

    window.onload = initSelectors;
  </script>
</body>
</html>
